# Cloudflare Workers の設定。`pnpm run dev` はこのファイルを読んで
# http://localhost:8787 に画面を出す。
name = "crm"
main = "src/app/server.ts"
compatibility_date = "2026-09-01"

# 顧客データの置き場（Cloudflare D1）。
# database_id は本番の置き場を作ったときに Cloudflare が発行する値で、いまは仮。
# 手元での確認（--local）はこの値を見ないため空のままで動く。T027（公開）で本物に差し替える。
[[d1_databases]]
binding = "DB"
database_name = "crm"
database_id = "local-only-placeholder"

# 画面の見た目（public/style.css）。ここに置いたファイルは、Worker を通さずに
# そのまま返される。CSS を TypeScript の中に埋めないのは、書き換えるたびに
# 画面の組み立て側を触ることになるため。
[assets]
directory = "./public"
